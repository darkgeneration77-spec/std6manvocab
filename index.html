:25px;align-items:center}.hero h1{font-size:clamp(30px,5vw,55px);line-height:1.22;margin:10px 0;color:#42317c}.hero p{line-height:1.7}.toy{width:180px;height:205px;position:relative;filter:drop-shadow(8px 18px 7px #655c7b35);animation:float 5s infinite}.toy .head{position:absolute;top:29px;left:21px;width:140px;height:135px;border-radius:48% 48% 43% 43%;background:linear-gradient(125deg,#fff9e8,#ffb5d2);border:4px solid #fff;box-shadow:inset -12px -10px #ec91c550}.toy .ear{position:absolute;top:3px;width:56px;height:76px;background:#f9afd4;border:4px solid #fff;border-radius:55% 55% 25% 25%}.toy .ear.l{left:25px;rotate:-22deg}.toy .ear.r{right:25px;rotate:22deg}.toy .eye{position:absolute;top:82px;width:18px;height:26px;border-radius:50%;background:#32284a}.toy .eye.l{left:58px}.toy .eye.r{right:58px}.toy .mouth{position:absolute;top:117px;left:85px;width:14px;height:8px;border-bottom:4px solid #9e4d82;border-radius:50%}.toy .body{position:absolute;bottom:2px;left:43px;width:100px;height:67px;border-radius:50% 50% 25% 25%;background:linear-gradient(#b5a3ff,#8870df);border:4px solid white;z-index:-1}.label{font-weight:800;margin:16px 0 8px;display:block}input,select{width:100%;padding:16px 18px;border-radius:17px;border:2px solid #ddd3f5;background:#fff;color:#31284a;outline:none;min-height:60px}input:focus,select:focus{border-color:#a078ff;box-shadow:0 0 0 4px #a078ff33}.settings{display:grid;grid-template-columns:1fr 1fr;gap:18px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 26px;border-radius:18px;background:linear-gradient(135deg,#9a6bfa,#7047d2);color:#fff;font-weight:900;min-height:60px;box-shadow:0 8px 0 #5235a5,0 14px 25px #644b9d44;transition:transform .12s,box-shadow .12s}.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #5235a5}.btn.pink{background:linear-gradient(135deg,#ff8dbd,#ed548e);box-shadow:0 8px 0 #b5376c,0 14px 25px #a44a7b44}.btn.light{background:#fff;color:#543e91;border:2px solid #d8c9f6;box-shadow:0 6px 0 #c5b8e2}.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:25px}.small{color:#695f7c;font-size:20px;line-height:1.6}.hidden{display:none!important}.progress{height:19px;border-radius:30px;background:#d8cee9;overflow:hidden;border:2px solid #fff}.bar{height:100%;width:0%;background:linear-gradient(90deg,#f78bc0,#a16cf5,#66d8d4);transition:width .3s}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:800;margin:0 0 14px}.question{font-size:clamp(24px,3.2vw,32px);line-height:1.55;font-weight:900;margin:24px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{background:#fff;border:3px solid #e6dafa;border-radius:20px;padding:19px 16px;min-height:84px;text-align:left;color:#31294a;font-weight:800;box-shadow:0 5px 0 #d5c9e9}.choice:hover:not(:disabled){border-color:#a987f0}.choice.selected{border-color:#8151de;background:#e9ddff}.choice.correct{background:#d8ffe7;border-color:#31aa73}.choice.wrong{background:#ffe0e6;border-color:#e65e7e}.feedback{margin-top:20px;border-radius:18px;padding:17px;background:#f2edff;line-height:1.65}.score{font-size:clamp(58px,11vw,120px);font-weight:1000;line-height:1.1;color:#7550cf;text-shadow:4px 5px #fff;text-align:center}.status{text-align:center;font-weight:900;font-size:30px}.review{margin-top:20px;max-height:390px;overflow:auto}.reviewitem{padding:15px;border-bottom:1px solid #e0d7eb;line-height:1.55}.foot{text-align:center;color:#655a78;margin-top:28px}.pill{display:inline-block;background:#fff0a4;border-radius:30px;padding:8px 16px;font-weight:900}.cert{border:8px double #d4b45d;background:#fffdf3;padding:32px;text-align:center;border-radius:20px}.cert h2{color:#8b6c27}.certname{font-size:36px;font-weight:900;border-bottom:2px solid #bd9d48;padding:12px}@media(max-width:650px){.hero{grid-template-columns:1fr}.toy{margin:auto}.settings,.choices{grid-template-columns:1fr}.glass{border-radius:24px}.btn{width:100%}}@media print{body{background:white}.scene,.top,.actions,.foot,.noprint{display:none!important}.glass{box-shadow:none;border:none}.wrap{width:100%;padding:0}.cert{margin-top:70px}}
/* Five alternating answer effects: confetti, starburst, bubble-pop, rainbow-wave, toy-bounce */
.fx-layer{position:fixed;inset:0;z-index:99;pointer-events:none;overflow:hidden;contain:layout paint}
.fx-piece{position:absolute;left:50%;top:45%;display:block;will-change:transform,opacity;animation:fx-fly .95s cubic-bezier(.1,.6,.3,1) forwards;font-size:34px;font-family:Arial,sans-serif;text-shadow:0 3px 8px #ffffffa0}
.fx-piece.confetti{width:13px;height:22px;border-radius:4px}
.fx-piece.bubble{border:3px solid #ffffffa8;border-radius:50%;box-shadow:inset -5px -6px 8px #ffffff66,0 0 12px #ffffff8c}
.fx-ring{position:absolute;left:50%;top:45%;width:90px;height:90px;border:8px solid #ffb3d7;border-radius:50%;transform:translate(-50%,-50%) scale(.2);animation:fx-ring .7s ease-out forwards}
.fx-wave{position:absolute;left:-15%;top:40%;width:130%;height:120px;transform:rotate(-10deg) scaleY(.05);border-radius:100%;background:linear-gradient(90deg,#ffb9dd88,#ffe77d88,#a9f4d688,#bcb2ff88);filter:blur(14px);animation:fx-wave .8s ease-out forwards}
.fx-toy{position:absolute;left:50%;top:42%;font-size:110px;transform:translate(-50%,-50%) scale(.1);filter:drop-shadow(0 12px 8px #5e3e8844);animation:fx-toy .85s cubic-bezier(.15,.8,.25,1) forwards}
.fx-banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#ffffffeb;border:3px solid #fff;border-radius:22px;padding:12px 25px;box-shadow:0 15px 45px #5c429044;font-size:clamp(24px,4vw,36px);font-weight:900;white-space:nowrap;color:#6246a5;animation:fx-banner .85s ease-out forwards}
.fx-shake{animation:fx-shake .4s ease-in-out}
@keyframes fx-fly{0%{transform:translate(-50%,-50%) scale(.25) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--end-scale,1)) rotate(var(--spin,270deg));opacity:0}}

</style></head><body><div class="scene"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div><div id="fxLayer" class="fx-layer" aria-hidden="true"></div><main class="wrap"><header class="top"><div class="logo">✦ 词汇星球 · TOY LAB</div><div class="chip">80分及格 · 20课词汇</div></header><section id="setup" class="glass"><div class="hero"><div><span class="pill">2027 · 六年级华语</span><h1>词汇应用<br>潮玩挑战赛</h1><p>读懂情境，选出正确词汇。完成全部题目才公布成绩。及格即可领取个人文凭！</p></div><div class="toy" aria-hidden="true"><div class="ear l"></div><div class="ear r"></div><div class="head"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div><div class="body"></div></div></div><label class="label" for="student">学生姓名（必填）</label><input id="student" maxlength="36" placeholder="请输入学生姓名" autocomplete="name"><div class="settings"><div><label class="label" for="lesson">测验范围</label><select id="lesson"></select></div><div><label class="label" for="count">题目数量</label><select id="count"><option value="10">10题 · 快速挑战</option><option value="15">15题</option><option value="20" selected>20题 · 标准挑战</option><option value="30">30题</option><option value="40">40题 · 进阶挑战</option></select></div></div><p class="small" id="available"></p><div class="actions"><button class="btn pink" onclick="start()">开始挑战！</button></div><p class="small">题目从词汇本随机抽取；每次重新挑战会重新排序。使用浏览器内置中文语音朗读成绩。</p></section><section id="quiz" class="glass hidden"><div class="stats"><span id="qcounter"></span><span id="qname"></span></div><div class="progress"><div class="bar" id="progressbar"></div></div><div class="question" id="question"></div><div class="choices" id="options"></div><div class="feedback hidden" id="feedback"></div><div class="actions"><button class="btn pink hidden" id="next" onclick="next()">下一题</button></div></section><section id="result" class="glass hidden"><div class="pill">挑战完成 · 成绩报告</div><div class="score" id="score"></div><div class="status" id="status"></div><p class="small" style="text-a function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function init(){const sel=$('lesson');sel.innerHTML='<option value="all">全20课综合测验</option>'+LESSONS.map(l=>`<option value="${l.id}">第${l.id}课 · ${escapeHTML(l.title)}</option>`).join('');sel.onchange=updateCount;$('count').onchange=updateCount;updateCount();}
function updateCount(){const v=$('lesson').value;const n=v==='all'?all.length:LESSONS[+v-1].words.length;$('available').textContent=`本范围有 ${n} 个词汇；每题5分或按实际题数换算，满分100分。`;$('count').querySelectorAll('option').forEach(o=>o.disabled=+o.value>n);if(+$('count').value>n)$('count').value=String([10,15,20,30,40].filter(x=>x<=n).pop()||10);}
function makeQuestion(target,scope){let other=scope.filter(x=>x.w!==target.w);if(other.length<3)other=all.filter(x=>x.w!==target.w);const options=shuffle([target,...shuffle([...other]).slice(0,3)]).map(x=>x.w);let scenario=SCENARIOS[target.w];let q=scenario?`阅读情境，选出最恰当的词语：<div style="margin-top:12px;color:#6c4aab">「${escapeHTML(scenario)}」</div>`:`根据下列意思，选出最恰当的词语：<div style="margin-top:12px;color:#6c4aab">「${escapeHTML(target.m)}」</div>`;return {target,options,q};}
function start(){let name=$('student').value.trim();if(!name){$('student').focus();alert('请先填写学生姓名。');return;}if(name.length>36){alert('姓名请控制在36字以内。');return;}let lesson=$('lesson').value;let pool=lesson==='all'?all:all.filter(w=>w.lesson===+lesson);let n=Math.min(+$('count').value,pool.length);let selected=shuffle([...pool]).slice(0,n);state={name,pool,questions:selected.map(w=>makeQuestion(w,pool)),idx:0,answers:[],locked:false,lesson:lesson==='all'?'全20课综合测验':`第${lesson}课 · ${LESSONS[+lesson-1].title}`,started:new Date()};$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();window.scrollTo(0,0);}
function render(){let i=state.idx,q=state.questions[i];state.locked=false;$('qcounter').textContent=`第 ${i+1} / ${state.questions.length} 题`;$('qname').textContent=state.name;$('progressbar').style.width=`${100*i/state.questions.length}%`;$('question').innerHTML=q.q;$('options').innerHTML=q.options.map((w,j)=>`<button class="choice" data-i="${j}">${String.fromCharCode(65+j)}. ${escapeHTML(w)}</button>`).join('');$('options').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.i));$('feedback').classList.add('hidden');$('next').classList.add('hidden');}
let fxTurn=0,fxTimer=null;
function answerEffect(correct){
 const layer=$('fxLayer');layer.replaceChildren();if(fxTimer)clearTimeout(fxTimer);
 const mode=fxTurn++%5, colors=['#ff70b2','#ffd75c','#8ee6df','#a58aff','#ff9c79'];
 function add(className,css={},txt=''){let el=document.createElement('span');el.className=className;el.textContent=txt;Object.assign(el.style,css);layer.appendChild(el);return el;}
 function burst(kind,n){for(let k=0;k<n;k++){let angle=(k/n)*Math.PI*2+(Math.random()-.5)*.5,dist=140+Math.random()*Math.min(360,innerWidth*.35);let style={'--dx':Math.cos(angle)*dist+'px','--dy':Math.sin(angle)*dist+'px','--spin':(Math.random()*650-325)+'deg',animationDelay:(Math.random()*.13)+'s'};if(kind==='confetti'){Object.assign(style,{background:colors[k%5],width:9+Math.random()*9+'px',height:14+Math.random()*15+'px'});}if(kind==='bubble'){Object.assign(style,{background:colors[k%5]+'77',width:20+Math.random()*55+'px',height:20+Math.random()*55+'px'});}add('fx-piece '+kind,style,kind==='star'?['✦','★','✧','✶'][k%4]:'');}}
 if(mode===0){burst('confetti',35);add('fx-banner',{},correct?'彩纸庆祝！':'继续挑战！');}
 if(mode===1){burst('star',20);add('fx-ring');add('fx-banner',{},correct?'星光闪耀！':'再接再厉！');}
 if(mode===2){burst('bubble',23);add('fx-banner',{},correct?'泡泡爆发！':'下一题加油！');}
 if(mode===3){add('fx-wave');burst('star',12);add('fx-banner',{},correct?'彩虹能量！':'积累新知识！');}
 if(mode===4){add('fx-toy',{},correct?'🐰':'🧸');burst('confetti',15);add('fx-banner',{},correct?'潮玩跳跃！':'勇敢再试！');}
 if(!correct){const quiz=$('quiz');quiz.classList.remove('fx-shake');void quiz.offsetWidth;quiz.classList.add('fx-shake');setTimeout(()=>quiz.classList.remove('fx-shake'),430);}
 fxTimer=setTimeout(()=>layer.replaceChildren(),1250);
}
function answer(i){if(state.locked)return;state.locked=true;let q=state.questions[state.idx],chosen=q.options[i],correct=chosen===q.target.w;state.answers.push({q,chosen,correct});answerEffect(correct);$('options').querySelectorAll('button').forEach(b=>{b.disabled=true;let w=q.options[+b.dataset.i];if(w===q.target.w)b.classList.add('correct');else if(+b.dataset.i===i)b.classList.add('wrong');});$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${correct?'回答正确！':'回答错误。'}</strong><div>正确答案：<strong>${escapeHTML(q.target.w)}</strong>（${escapeHTML(q.target.p)}）</div><div>意思：${escapeHTML(q.target.m)}</div>`;$('next').textContent=state.idx===state.questions.length-1?'提交整套测验并公布成绩':'下一题';$('next').classList.remove('hidden');}
function next(){if(!state.locked)return;state.idx++;if(state.idx<state.questions.length)render();else finish();}
function speakScore(){const text=`${state.name}同学，测验完成。你的成绩是${state.score}分，答对${state.correct}题，共${state.questions.length}题。${state.passed?'恭喜你及格了！':'还没有达到八十分的及格标准，请继续加油！'}`;if(!('speechSynthesis' in window)){alert('此浏览器不支持语音播报。');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.volume=1;u.rate=.82;u.pitch=1.12;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/zh-(CN|MY|SG)/i.test(v.lang))||voices.find(v=>v.lang.startsWith('zh'))||null;speechSynthesis.speak(u);}
function finish(){state.correct=state.answers.filter(x=>x.correct).length;state.score=Math.round(100*state.correct/state.questions.length);state.passed=state.score>=80;state.finished=new Date();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('progressbar').style.width='100%';$('score').textContent=state.score+'分';$('status').textContent=state.passed?'恭喜及格！获得潮玩学霸文凭':'尚未及格，再接再厉！';$('status').style.color=state.passed?'#388a64':'#c45073';$('summary').textContent=`${state.name} · ${state.lesson} · 答对 ${state.correct}/${state.questions.length} 题 · 及格线80分`;$('certificateBtn').classList.toggle('hidden',!state.passed);$('review').innerHTML=state.answers.map((a,i)=>`<div class="reviewitem"><strong>${i+1}. ${a.correct?'✓ 正确':'✗ 错误'}</strong> · ${escapeHTML(a.q.target.w)}（${escapeHTML(a.q.target.p)}）<div>你的选择：${escapeHTML(a.chosen)}；正确答案：${escapeHTML(a.q.target.w)}</div><div>${escapeHTML(a.q.target.m)}</div></div>`).join('');setTimeout(speakScore,350);window.scrollTo(0,0);}
function download(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function safeFile(s){return s.replace(/[\\/:*?"<>|]/g,'_').slice(0,35);}
function downloadResult(){const rows=[['学生姓名','测试范围','日期','总题数','答对题数','成绩','结果'],[state.name,state.lesson,state.finished.toLocaleString('zh-CN'),state.questions.length,state.correct,state.score,state.passed?'及格':'未及格'],[],['题号','词汇','拼音','意思','学生答案','正确答案','结果'],...state.answers.map((a,i)=>[i+1,a.q.target.w,a.q.target.p,a.q.target.m,a.chosen,a.q.target.w,a.correct?'正确':'错误'])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(`六年级词汇成绩_${safeFile(state.name)}.csv`,new Blob([csv],{type:'text/csv;charset=utf-8'}));}
function certificate(){if(!state.passed)return;let name=escapeHTML(state.name),lesson=escapeHTML(state.lesson),date=state.finished.toLocaleDateString('zh-CN');let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#fff3bd"/><stop offset=".5" stop-color="#fffaff"/><stop offset="1" stop-color="#e5d8ff"/></linearGradient></defs><rect width="1200" height="850" fill="url(#g)"/><rect x="36" y="36" width="1128" height="778" rx="28" fill="none" stroke="#bd9b4b" stroke-width="12"/><rect x="54" y="54" width="1092" height="742" rx="20" fill="none" stroke="#e1c779" stroke-width="3"/><g font-family="KaiTi,STKaiti,serif" text-anchor="middle" fill="#4b337b"><text x="600" y="153" font-size="38">2027 · 六年级华语词汇应用挑战</text><text x="600" y="252" font-size="84" font-weight="bold">优秀达标文凭</text><text x="600" y="334" font-size="31">兹证明</text><text x="600" y="432" font-size="66" font-weight="bold">${name}</text><path d="M270 454H930" stroke="#c2a66a" stroke-width="3"/><text x="600" y="522" font-size="30">在 ${lesson} 中表现优秀</text><text x="600" y="604" font-size="44">成绩：${state.score} 分 · 达到 80 分及格标准</text><text x="600" y="686" font-size="27">颁发日期：${date}</text><text x="600" y="746" font-size="24">词汇应用能力学习纪念证书</text></g><g fill="#f7c3db" stroke="#a277c9" stroke-width="5"><circle cx="145" cy="145" r="48"/><circle cx="1055" cy="145" r="48"/><circle cx="145" cy="705" r="48"/><circle cx="1055" cy="705" r="48"/></g></svg>`;download(`词汇优秀达标文凭_${safeFile(state.name)}.svg`,new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));}
function restart(){$('fxLayer').replaceChildren();$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('setup').classList.remove('hidden');window.scrollTo(0,0);}init();</script></body></html>
